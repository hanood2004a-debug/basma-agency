<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>عرض سعر | بصمة للحلول الرقمية</title>
<link rel="icon" type="image/png" href="../assets/basma-logo-navbar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #c9a98d; --ink: #1c2530; --mute: #6b7583; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef0f2; font-family: 'Tajawal', sans-serif; color: var(--ink); }
  .doc { max-width: 820px; margin: 24px auto; background: #fff; padding: 44px 48px; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.12); }
  .doc-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold); padding-bottom: 18px; }
  .doc-head .brand { display: flex; align-items: center; gap: 10px; }
  .doc-head .brand img { width: 46px; height: 46px; border-radius: 10px; }
  .doc-head .brand strong { font-size: 19px; display: block; }
  .doc-head .brand span { font-size: 12px; color: var(--mute); }
  .doc-head .meta { text-align: left; font-size: 13px; color: var(--mute); }
  .doc-head .meta strong { display: block; color: var(--ink); font-size: 15px; }
  .doc h1 { font-size: 22px; margin: 26px 0 4px; }
  .doc .sub { color: var(--mute); font-size: 13px; margin-bottom: 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
  .box { background: #f7f5f1; border-radius: 8px; padding: 14px 16px; font-size: 13px; }
  .box h3 { margin: 0 0 8px; font-size: 12px; color: var(--gold); text-transform: uppercase; letter-spacing: .04em; }
  table.items { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13px; }
  table.items th { text-align: start; background: var(--ink); color: #fff; padding: 10px 12px; font-size: 12px; }
  table.items td { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; }
  .totals { display: flex; justify-content: flex-end; margin-top: 14px; }
  .totals table { font-size: 13.5px; }
  .totals td { padding: 5px 14px; }
  .totals tr.grand td { font-weight: 900; font-size: 16px; color: var(--ink); border-top: 2px solid var(--gold); padding-top: 10px; }
  .section { margin-top: 20px; font-size: 13px; }
  .section h3 { font-size: 12.5px; color: var(--gold); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .doc-foot { margin-top: 32px; border-top: 1px solid #e5e5e5; padding-top: 14px; font-size: 11.5px; color: var(--mute); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .print-bar { max-width: 820px; margin: 0 auto 12px; display: flex; justify-content: flex-end; gap: 10px; padding: 0 4px; }
  .print-bar button { background: var(--ink); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
  @media print {
    body { background: #fff; }
    .print-bar { display: none; }
    .doc { box-shadow: none; margin: 0; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="print-bar"><button onclick="window.print()">طباعة / حفظ PDF</button></div>
<main class="doc" id="doc">
  <div class="crm-loading" style="padding:60px;text-align:center;color:#6b7583">جارٍ التحميل…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";
  var STATUS_LABELS = { draft: "مسودة", sent: "أُرسل", viewed: "تمت مشاهدته", accepted: "مقبول", rejected: "مرفوض", expired: "منتهي الصلاحية" };
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(n, c) { return Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 }) + " " + (c || "USD"); }
  function fmtDate(v) { if (!v) return "—"; try { return new Date(v).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" }); } catch (e) { return v; } }

  async function boot() {
    var id = new URLSearchParams(window.location.search).get("id");
    var doc = document.getElementById("doc");
    if (!id) { doc.innerHTML = '<p style="text-align:center;padding:60px">لم يتم تحديد عرض سعر.</p>'; return; }

    try {
      var cfgRes = await fetch("/api/crm-config"); var cfg = await cfgRes.json();
      if (!cfgRes.ok) throw new Error(cfg.message || "crm_not_configured");
      var client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true } });

      var sessionRes = await client.auth.getSession();
      if (!sessionRes.data.session) { window.location.href = "login.html?redirect=" + encodeURIComponent("proposal-print.html?id=" + id); return; }

      var pRes = await client.from("crm_proposals").select("*").eq("id", id).single();
      if (pRes.error) throw pRes.error;
      var p = pRes.data;

      var itemsRes = await client.from("crm_proposal_items").select("*").eq("proposal_id", id).order("sort_order");
      var items = itemsRes.data || [];

      var company = null;
      if (p.company_id) { var cRes = await client.from("crm_companies").select("*").eq("id", p.company_id).maybeSingle(); company = cRes.data; }
      var lead = null;
      if (p.lead_id) { var lRes = await client.from("crm_leads").select("*").eq("id", p.lead_id).maybeSingle(); lead = lRes.data; }

      document.title = p.proposal_number + " | بصمة للحلول الرقمية";

      doc.innerHTML =
        '<div class="doc-head">' +
        '<div class="brand"><img src="../assets/basma-logo-navbar.webp" alt="بصمة"><div><strong>بصمة للحلول الرقمية</strong><span>Basma Digital Solutions</span></div></div>' +
        '<div class="meta"><strong>' + esc(p.proposal_number) + '</strong>تاريخ الإصدار: ' + fmtDate(p.created_at) + '<br>الحالة: ' + (STATUS_LABELS[p.status] || p.status) + "</div>" +
        "</div>" +
        "<h1>" + esc(p.title) + "</h1>" +
        '<div class="sub">صالح حتى: ' + fmtDate(p.valid_until) + "</div>" +
        '<div class="grid2">' +
        '<div class="box"><h3>معلومات بصمة</h3>بصمة للحلول الرقمية<br>basmadigital.ps@gmail.com<br>www.basmadigital.com</div>' +
        '<div class="box"><h3>بيانات العميل</h3>' + esc((company && company.name) || (lead && lead.title) || "—") +
        (company && company.email ? "<br>" + esc(company.email) : "") + (company && company.phone ? "<br>" + esc(company.phone) : "") + "</div>" +
        "</div>" +
        '<table class="items"><thead><tr><th>البند</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>' +
        items.map(function (i) {
          return "<tr><td>" + esc(i.item_name) + (i.description ? '<div style="color:#6b7583;font-size:11.5px">' + esc(i.description) + "</div>" : "") + "</td>" +
            "<td>" + i.quantity + "</td><td>" + money(i.unit_price, p.currency) + "</td><td>" + money(i.total, p.currency) + "</td></tr>";
        }).join("") +
        "</tbody></table>" +
        '<div class="totals"><table>' +
        "<tr><td>الإجمالي الفرعي</td><td>" + money(p.subtotal, p.currency) + "</td></tr>" +
        "<tr><td>الخصم</td><td>-" + money(p.discount, p.currency) + "</td></tr>" +
        '<tr class="grand"><td>الإجمالي النهائي</td><td>' + money(p.total, p.currency) + "</td></tr>" +
        "</table></div>" +
        (p.scope ? '<div class="section"><h3>نطاق العمل</h3><p>' + esc(p.scope).replace(/\n/g, "<br>") + "</p></div>" : "") +
        (p.terms ? '<div class="section"><h3>الشروط</h3><p>' + esc(p.terms).replace(/\n/g, "<br>") + "</p></div>" : "") +
        '<div class="doc-foot"><span>بصمة للحلول الرقمية — من الفكرة إلى الإطلاق</span><span>' + esc(p.proposal_number) + "</span></div>";
    } catch (err) {
      doc.innerHTML = '<p style="text-align:center;padding:60px;color:#b23">تعذّر تحميل عرض السعر: ' + esc(err.message || "") + "</p>";
    }
  }

  boot();
})();
</script>
</body>
</html>
