<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>الإشعارات | Basma CRM</title>
<link rel="icon" type="image/png" href="../assets/basma-logo-navbar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/crm.css">
</head>
<body class="crm-body">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/crm-client.js"></script>
<script>
(function () {
  "use strict";
  var CRM = window.Basma.CRM;
  var db, currentFilter = "all", loaded = [], canMarkRead = false;
  var PAGE_SIZE = 25, cursor = null, hasMore = true;

  function typeLabel(type) {
    var labels = {
      lead_new_website: "Lead جديد — نموذج التواصل",
      lead_new_booking: "حجز استشارة جديد",
      lead_new_manual: "Lead جديد يدوي",
      meeting_scheduled: "اجتماع مجدول",
      meeting_reminder_24h: "تذكير اجتماع (24 ساعة)",
      meeting_reminder_today: "اجتماع اليوم",
      task_due_today: "مهمة مستحقة اليوم",
      task_overdue: "مهمة متأخرة",
      proposal_created: "عرض سعر جديد",
      proposal_status_changed: "تغيّرت حالة عرض السعر",
      lead_stage_changed: "تغيّرت مرحلة Lead",
      lead_won: "صفقة رابحة",
      lead_lost: "صفقة خاسرة",
      lead_no_activity_3d: "بدون نشاط 3 أيام",
      lead_inactive_7d: "غير نشط 7 أيام",
      whatsapp_logged: "تم تسجيل رسالة واتساب",
      outreach_followup_due: "موعد متابعة تواصل مستحق"
    };
    return labels[type] || type;
  }

  function iconSvgFor(name) {
    var paths = {
      users: '<path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM4 20c0-3 2.5-5 5-5s5 2 5 5M17 11a3 3 0 1 0-1.5-5.6M15.5 20c.3-2.3 1.7-4 3.5-4.6"/>',
      calendar: '<path d="M4 8h16M6 4v3M18 4v3M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/>',
      check: '<path d="M4 7h16M4 12h16M4 17h10"/><path d="M18 15l2 2 3-3"/>',
      file: '<path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/>',
      columns: '<path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v13h-4z"/>',
      bell: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (paths[name] || paths.bell) + "</svg>";
  }

  function render() {
    var wrap = document.getElementById("crmNotifPageList");
    var empty = document.getElementById("crmNotifPageEmpty");
    var items = currentFilter === "unread" ? loaded.filter(function (n) { return !n.is_read; }) : loaded;
    if (!items.length) {
      wrap.style.display = "none";
      empty.style.display = "block";
      return;
    }
    wrap.style.display = "flex";
    empty.style.display = "none";
    wrap.innerHTML = items.map(function (n) {
      var meta = (CRM.notifications.typeMeta[n.type]) || { icon: "bell", badge: "gold" };
      var unreadCls = n.is_read ? "" : " is-unread";
      return (
        '<a href="' + CRM.escape(n.link || "#") + '" class="crm-notif-page-item' + unreadCls + '" data-id="' + n.id + '">' +
        '<span class="crm-notif-page-item-icon crm-badge-' + meta.badge + '">' + iconSvgFor(meta.icon) + "</span>" +
        '<span class="crm-notif-page-item-body">' +
        '<strong>' + CRM.escape(typeLabel(n.type)) + " — " + CRM.escape(n.title) + "</strong>" +
        (n.description ? "<p>" + CRM.escape(n.description) + "</p>" : "") +
        "<time>" + CRM.formatDateTime(n.created_at) + "</time>" +
        "</span>" +
        '<span class="crm-notif-page-item-actions">' + (n.is_read ? "" : '<span class="crm-badge crm-badge-gold">جديد</span>') + "</span>" +
        "</a>"
      );
    }).join("");

    if (canMarkRead) {
      wrap.querySelectorAll(".crm-notif-page-item").forEach(function (el) {
        el.addEventListener("click", function () {
          var id = el.getAttribute("data-id");
          CRM.notifications.markRead(db, id);
        });
      });
    }

    var loadMoreBtn = document.getElementById("crmLoadMore");
    if (loadMoreBtn) loadMoreBtn.style.display = hasMore ? "" : "none";
  }

  // True cursor pagination: each "load more" click fetches only the NEXT
  // PAGE_SIZE rows older than the last-loaded item's created_at, instead of
  // re-fetching everything from the start with an ever-growing LIMIT.
  async function load(reset) {
    if (reset) { loaded = []; cursor = null; hasMore = true; }
    if (!hasMore) return;
    var list = document.getElementById("crmNotifPageList");
    if (reset) list.innerHTML = '<div class="crm-loading">جارِ التحميل…</div>';
    try {
      var query = db.from("crm_notifications").select("*").order("created_at", { ascending: false }).limit(PAGE_SIZE);
      if (cursor) query = query.lt("created_at", cursor);
      var res = await query;
      if (res.error) throw res.error;
      var batch = res.data || [];
      loaded = loaded.concat(batch);
      if (batch.length < PAGE_SIZE) { hasMore = false; } else { cursor = batch[batch.length - 1].created_at; }
      render();
    } catch (err) {
      if (reset) list.innerHTML = "";
      CRM.toast("تعذّر تحميل الإشعارات: " + (err.message || ""), "danger");
    }
  }

  async function boot() {
    var ctx = await CRM.boot({ activeKey: "", title: "الإشعارات", sub: "كل التنبيهات الخاصة بحساباتك ونشاط المبيعات" });
    if (!ctx) return;
    db = ctx.client;
    canMarkRead = !!(ctx.who && ctx.who.can_write);

    document.getElementById("crmTopbarActions").innerHTML =
      (canMarkRead ? '<button class="crm-btn crm-btn-sm" id="crmMarkAllPage">تعليم الكل كمقروء</button>' : "") +
      '<button class="crm-btn crm-btn-sm" id="crmLoadMore">تحميل المزيد</button>';
    if (canMarkRead) {
      document.getElementById("crmMarkAllPage").addEventListener("click", async function () {
        await CRM.notifications.markAllRead(db);
        await load(true);
      });
    }
    document.getElementById("crmLoadMore").addEventListener("click", async function () {
      await load(false);
    });

    document.getElementById("crmApp").innerHTML =
      '<div class="crm-card">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
      '<button class="crm-btn crm-notif-filter-tab is-active" data-filter="all">الكل</button>' +
      '<button class="crm-btn crm-notif-filter-tab" data-filter="unread">غير المقروءة</button>' +
      "</div>" +
      '<div class="crm-notif-page-list" id="crmNotifPageList"></div>' +
      '<div class="crm-empty" id="crmNotifPageEmpty" style="display:none">' + iconSvgFor("bell") + "<h2 style=\"color:#fbf7f0\">لا توجد إشعارات</h2><p>ستظهر هنا كل التنبيهات المتعلقة بالمبيعات فور حدوثها.</p></div>" +
      "</div>";

    document.querySelectorAll(".crm-notif-filter-tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".crm-notif-filter-tab").forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    await load(true);
  }

  boot();
})();
</script>
</body>
</html>
